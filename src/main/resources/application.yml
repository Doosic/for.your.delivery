server:
  port: 30100
  title: delivery
  version: '@project.version@'
  servlet:
    context-path: /delivery

spring:
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/calendar.events.readonly
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
        provider:
          google:
            user-name-attribute: email
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: false
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://172.30.1.85:5432/rag
    username: admin
    password: admin
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 10
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

logging:
  level:
    root: info
    org.springframework: error


delivery:
  frontend-base-url: ${FUB_FRONTEND_BASE_URL:http://localhost:3500}

  external:
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
    elevenst:
      api-key: ${ELEVENST_API_KEY:}

  product:
    price-collection-initial-delay-ms: 60000
    price-collection-fixed-delay-ms: 21600000

  jwt:
    accessHeader: DeliveryAuthAccess
    refreshHeader: DeliveryAuthRefresh
    accessTimeoutMin: 1000
    refreshTimeoutMin: 2000
    secret: ${JWT_REAL_KEY:}
  content-root-path: //172.30.1.85/vod/fut/content
  content-root-url: http://172.30.1.85/vod/fut/content
