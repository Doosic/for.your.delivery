server:
  port: 30100
  title: delivery
  version: '@project.version@'
  servlet:
    context-path: /delivery

spring:
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_SECRET:not-configured}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
        provider:
          google:
            user-name-attribute: email
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: false
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://172.30.1.85:5432/rag
    username: admin
    password: admin
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 10
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

logging:
  level:
    root: info
    org.springframework: error


delivery:
  frontend-base-url: ${FUB_FRONTEND_BASE_URL:http://localhost:3500}

  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
    model: gpt-5.4-nano
    reasoning-effort: none
    max-output-tokens: 600
    connect-timeout-ms: 3000
    read-timeout-ms: 15000

  google-calendar:
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI=https://codegate.shop/delivery/wp/calendar/google/callback}

  external:
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_SECRET:}
    elevenst:
      api-key: ${ELEVENST_SECRET:}

  product:
    price-collection-initial-delay-ms: 60000
    price-collection-fixed-delay-ms: 21600000

  jwt:
    accessHeader: DeliveryAuthAccess
    refreshHeader: DeliveryAuthRefresh
    accessTimeoutMin: 1000
    refreshTimeoutMin: 2000
    secret: ${JWT_REAL_KEY:}
  content-root-path: //172.30.1.85/vod/fut/content
  content-root-url: http://172.30.1.85/vod/fut/content
